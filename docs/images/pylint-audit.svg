<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570"
     role="img" aria-labelledby="audit-title audit-desc">
  <title id="audit-title">Keto-Cat code audit: preliminary Pylint results</title>
  <desc id="audit-desc">Preliminary Pylint 4.1.3 audit on November 5, 2026. Pylint score 8.79 out of 10 before and 8.80 out of 10 after the cleanup. Findings other than missing docstrings fell from 8 to 3, which is 62.5 percent fewer. Total findings rose from 85 to 86, because new helper functions increased missing-docstring notices from 77 to 83. Neither run had error or warning category findings.</desc>

  <rect width="800" height="570" fill="#f6ead7"/>

  <!-- Café counter panel with a hard pixel shadow -->
  <rect x="24" y="24" width="752" height="536" fill="#3b2a20"/>
  <rect x="16" y="16" width="752" height="536" fill="#fffaf1" stroke="#3b2a20" stroke-width="4"/>

  <g font-family="'Courier New', Courier, monospace" fill="#3b2a20">
    <text x="44" y="62" font-size="26" font-weight="bold">KETO-CAT · CODE AUDIT</text>
    <text x="44" y="90" font-size="14">Preliminary audit · Pylint 4.1.3 · November 5, 2026</text>

    <!-- 1. Pylint score -->
    <rect x="44" y="112" width="696" height="100" fill="#f6ead7" stroke="#3b2a20" stroke-width="3"/>
    <text x="64" y="142" font-size="16" font-weight="bold">1. PYLINT SCORE</text>
    <text x="720" y="142" font-size="12" text-anchor="end">+0.01: missing docstrings dominate the score</text>
    <rect x="64" y="158" width="250" height="38" fill="#e8836b" stroke="#3b2a20" stroke-width="3"/>
    <text x="189" y="184" font-size="18" font-weight="bold" text-anchor="middle">BEFORE 8.79 / 10</text>
    <text x="392" y="187" font-size="28" font-weight="bold" text-anchor="middle">→</text>
    <rect x="470" y="158" width="250" height="38" fill="#f2b84b" stroke="#3b2a20" stroke-width="3"/>
    <text x="595" y="184" font-size="18" font-weight="bold" text-anchor="middle">AFTER 8.80 / 10</text>

    <!-- 2. Non-docstring findings: zero-based scale, 600 px = 8 findings -->
    <rect x="44" y="230" width="696" height="200" fill="#f6ead7" stroke="#3b2a20" stroke-width="3"/>
    <text x="64" y="260" font-size="16" font-weight="bold">2. NON-DOCSTRING FINDINGS</text>

    <text x="64" y="288" font-size="15" font-weight="bold">BEFORE</text>
    <text x="664" y="288" font-size="15" font-weight="bold" text-anchor="end">8 findings</text>
    <rect x="64" y="296" width="600" height="30" fill="#e8836b" stroke="#3b2a20" stroke-width="3"/>

    <text x="64" y="350" font-size="15" font-weight="bold">AFTER</text>
    <text x="664" y="350" font-size="15" font-weight="bold" text-anchor="end">3 findings</text>
    <rect x="64" y="358" width="600" height="30" fill="#fffaf1" stroke="#3b2a20" stroke-width="3"/>
    <rect x="64" y="358" width="225" height="30" fill="#f2b84b" stroke="#3b2a20" stroke-width="3"/>

    <g stroke="#3b2a20" stroke-width="2">
      <line x1="64" y1="400" x2="664" y2="400"/>
      <line x1="64" y1="400" x2="64" y2="407"/>
      <line x1="139" y1="400" x2="139" y2="404"/>
      <line x1="214" y1="400" x2="214" y2="407"/>
      <line x1="289" y1="400" x2="289" y2="404"/>
      <line x1="364" y1="400" x2="364" y2="407"/>
      <line x1="439" y1="400" x2="439" y2="404"/>
      <line x1="514" y1="400" x2="514" y2="407"/>
      <line x1="589" y1="400" x2="589" y2="404"/>
      <line x1="664" y1="400" x2="664" y2="407"/>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="64" y="421">0</text>
      <text x="214" y="421">2</text>
      <text x="364" y="421">4</text>
      <text x="514" y="421">6</text>
      <text x="664" y="421">8</text>
    </g>

    <!-- Takeaway and honest notes -->
    <text x="392" y="468" font-size="22" font-weight="bold" text-anchor="middle">62.5% fewer non-docstring findings</text>
    <text x="392" y="496" font-size="13" text-anchor="middle">Total findings: 85 → 86 (additional helper functions increased</text>
    <text x="392" y="514" font-size="13" text-anchor="middle">missing-docstring notices: 77 → 83).</text>
    <text x="392" y="532" font-size="13" text-anchor="middle">No error (E) or warning (W) category findings in either run.</text>
  </g>

  <!-- Pixel-art hacker cat with sunglasses and a laptop, on a 24 x 16 grid of 4 px "pixels" -->
  <g transform="translate(664 22) scale(4)" shape-rendering="crispEdges">
    <polygon points="4,0 5,0 5,1 6,1 6,2 7,2 7,3 8,3 8,4 4,4" fill="#8a3b12"/>
    <polygon points="20,0 19,0 19,1 18,1 18,2 17,2 17,3 16,3 16,4 20,4" fill="#8a3b12"/>
    <polygon points="5,2 6,2 6,3 7,3 7,4 5,4" fill="#e8836b"/>
    <polygon points="19,2 18,2 18,3 17,3 17,4 19,4" fill="#e8836b"/>
    <rect x="4" y="4" width="16" height="11" fill="#8a3b12"/>
    <!-- sunglasses -->
    <rect x="6" y="7" width="12" height="1" fill="#3b2a20"/>
    <rect x="7" y="7" width="4" height="3" fill="#3b2a20"/>
    <rect x="13" y="7" width="4" height="3" fill="#3b2a20"/>
    <rect x="8" y="8" width="1" height="1" fill="#fffaf1"/>
    <rect x="14" y="8" width="1" height="1" fill="#fffaf1"/>
    <rect x="11" y="10" width="2" height="1" fill="#e8836b"/>
    <rect x="0" y="9" width="4" height="1" fill="#3b2a20"/>
    <rect x="0" y="11" width="4" height="1" fill="#3b2a20"/>
    <rect x="20" y="9" width="4" height="1" fill="#3b2a20"/>
    <rect x="20" y="11" width="4" height="1" fill="#3b2a20"/>
    <!-- laptop seen from behind, with paws on the sides -->
    <rect x="6" y="11" width="12" height="5" fill="#3b2a20"/>
    <rect x="11" y="13" width="2" height="1" fill="#f2b84b"/>
    <rect x="3" y="14" width="3" height="2" fill="#8a3b12"/>
    <rect x="18" y="14" width="3" height="2" fill="#8a3b12"/>
  </g>
</svg>
