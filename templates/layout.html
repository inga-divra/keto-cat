<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keto-Cat – {% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="/static/main.css">
</head>

<body>
  <header>
    <h1 class="logo"><a href="/">KETO-CAT CAFÉ</a></h1>
    <nav>
      <a href="/">Home</a>
      {% if session.user_id %}
      <span>Logged in as {{ session.username }}</span>
      <form action="/logout" method="post" class="inline">
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
        <button type="submit">Log out</button>
      </form>
      {% else %}
      <a href="/register">Register</a>
      <a href="/login">Log in</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% for message in get_flashed_messages() %}
    <p class="message">{{ message }}</p>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Keto-Cat – a cozy keto and LCHF recipe café</p>
  </footer>
</body>

</html>
