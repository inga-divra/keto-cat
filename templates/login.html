{% extends "layout.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<section class="counter">
  <h2>Log in</h2>
  <p class="speech">Welcome back! Show me your loyalty card, please.</p>

  <form action="/login" method="post">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <p>
      <label for="username">Username</label><br>
      <input type="text" name="username" id="username" value="{{ filled.username }}"
             required maxlength="20" autocomplete="username">
    </p>
    <p>
      <label for="password">Password</label><br>
      <input type="password" name="password" id="password"
             required maxlength="128" autocomplete="current-password">
    </p>
    <button type="submit">Log in</button>
  </form>

  <p>No account yet? <a href="/register">Register</a></p>
</section>
{% endblock %}
