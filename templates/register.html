{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="counter">
  <h2>Create an account</h2>
  <p class="speech">Meow! New here? Tell me your name and I'll get you a loyalty card.</p>

  <form action="/register" method="post">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <p>
      <label for="username">Username</label><br>
      <input type="text" name="username" id="username" value="{{ filled.username }}"
             required minlength="3" maxlength="20" pattern="[A-Za-z0-9_\-]+" autocomplete="username">
      <br><small>3–20 characters: letters, numbers, - or _</small>
    </p>
    <p>
      <label for="password1">Password</label><br>
      <input type="password" name="password1" id="password1"
             required minlength="8" maxlength="128" autocomplete="new-password">
      <br><small>At least 8 characters</small>
    </p>
    <p>
      <label for="password2">Password again</label><br>
      <input type="password" name="password2" id="password2"
             required minlength="8" maxlength="128" autocomplete="new-password">
    </p>
    <button type="submit">Register</button>
  </form>

  <p>Already have an account? <a href="/login">Log in</a></p>
</section>
{% endblock %}
